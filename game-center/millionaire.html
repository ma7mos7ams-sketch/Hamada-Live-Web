<script>
(async()=>{
  const files=["/games/millionaire-part-01.html","/games/millionaire-part-02.html","/games/millionaire-part-03.html","/games/millionaire-part-04.html","/games/millionaire-part-05.html","/games/millionaire-part-06.html","/games/millionaire-part-07.html","/games/millionaire-part-08.html","/games/millionaire-part-09.html","/games/millionaire-part-10.html","/games/millionaire-part-11.html","/games/millionaire-part-12.html"];
  try{
    const responses=await Promise.all(files.map(f=>fetch(f,{cache:"force-cache"})));
    if(responses.some(r=>!r.ok)) throw new Error("load");
    const html=(await Promise.all(responses.map(r=>r.text()))).join("");
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<main class="loading"><div><h1>من سيربح المليون</h1><p>تعذر تحميل ملفات اللعبة. أعد تحديث الصفحة.</p></div></main>';
