.arena{width:min(96vw,1680px);max-width:none;height:min(72vh,820px);min-height:650px;margin:8px auto;border-radius:42px}
.player{width:190px;padding:8px 8px 9px;border-radius:22px;background:linear-gradient(145deg,rgba(25,31,42,.92),rgba(6,8,12,.94));border:1px solid rgba(255,255,255,.11);box-shadow:0 18px 40px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(12px);transition:.4s cubic-bezier(.2,.8,.2,1);transform:translate(-50%,-50%)}
.player:before{content:"";position:absolute;inset:-1px;border-radius:22px;padding:1px;background:linear-gradient(135deg,rgba(255,215,119,.72),transparent 42%,rgba(255,80,42,.42));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.player .avatarFrame{position:relative;width:102px;height:102px;margin:auto;border-radius:50%;padding:4px;background:conic-gradient(from 20deg,#fff1ac,#bc741a,#ff6037,#fff1ac);box-shadow:0 12px 28px #000,0 0 26px rgba(245,196,91,.22)}
.player .avatarFrame:after{content:"";position:absolute;inset:6px;border-radius:50%;box-shadow:inset 0 0 18px rgba(0,0,0,.46);pointer-events:none}
.player .avatar{width:100%;height:100%;border:0;margin:0;background:#1d232c;font-size:38px;overflow:hidden}
.player .avatar img{width:100%;height:100%;object-fit:cover}
.player .playerMeta{margin-top:7px;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.player .name{margin:0;max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;line-height:1.2;color:#fff;font-weight:900;text-shadow:0 2px 8px #000}
.player .num{flex:0 0 auto;min-width:28px;height:28px;display:grid;place-items:center;padding:0;background:linear-gradient(#ff7348,#8f160d);border:1px solid rgba(255,255,255,.25);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.player .stateBadge{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 9px;border-radius:99px;background:rgba(62,216,129,.12);border:1px solid rgba(93,255,166,.34);font-size:11px;color:#a9ffd0}
.player .stateBadge:before{content:"";width:7px;height:7px;border-radius:50%;background:#51e68d;box-shadow:0 0 9px #51e68d}
.player .kick{position:absolute;right:-7px;top:-7px;width:31px;height:31px;padding:0;border-radius:50%;font-size:0;border:2px solid rgba(255,255,255,.2);box-shadow:0 5px 14px #000;opacity:.72}
.player .kick:after{content:"×";font-size:21px;line-height:1}
.player:hover .kick{opacity:1}.player.holder{transform:translate(-50%,-50%) scale(1.11);z-index:15;background:linear-gradient(145deg,rgba(70,25,16,.96),rgba(10,8,10,.97));box-shadow:0 0 0 3px rgba(255,85,38,.2),0 0 46px rgba(255,64,24,.58),0 20px 42px rgba(0,0,0,.6)}
.player.holder .avatarFrame{animation:avatarDanger .58s ease-in-out infinite alternate;background:conic-gradient(from 0deg,#fff1a5,#ff5a27,#ff1d0d,#fff1a5)}
.player.holder .stateBadge{background:rgba(255,52,24,.2);border-color:rgba(255,105,67,.62);color:#ffe0d4}.player.holder .stateBadge:before{background:#ff4d2d;box-shadow:0 0 12px #ff3e20}
.player.holder:after{content:"حامل القنبلة";font-size:12px;font-weight:900;padding:5px 11px;margin-top:6px;background:linear-gradient(90deg,rgba(255,38,14,.24),rgba(255,145,45,.2));border:1px solid rgba(255,118,63,.58);animation:badgePulse .55s infinite alternate}
@keyframes avatarDanger{to{filter:brightness(1.16);box-shadow:0 12px 28px #000,0 0 42px rgba(255,61,25,.72)}}
@keyframes badgePulse{to{transform:scale(1.05)}}
.player.out{opacity:.5;filter:none;background:linear-gradient(145deg,rgba(42,43,47,.86),rgba(7,8,10,.9))}.player.out .avatarFrame{filter:grayscale(1) brightness(.52);background:#555}.player.out .stateBadge{color:#bbb;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}.player.out .stateBadge:before{background:#777;box-shadow:none}.player.out:after{content:"تم الإقصاء";display:block;color:#ff9e8e;font-weight:900;font-size:11px;margin-top:5px}
.elimOverlay{position:fixed;inset:0;display:none;place-items:center;background:radial-gradient(circle,rgba(94,20,8,.38),rgba(0,0,0,.84));z-index:96;pointer-events:none}.elimOverlay.show{display:grid;animation:elimFade 1.55s ease forwards}.elimCard{min-width:420px;padding:28px;text-align:center;border-radius:28px;background:linear-gradient(145deg,rgba(42,18,14,.97),rgba(7,9,13,.98));border:1px solid rgba(255,111,67,.52);box-shadow:0 0 90px rgba(255,45,18,.36),inset 0 1px 0 rgba(255,255,255,.08);transform:scale(.7);animation:elimPop .55s cubic-bezier(.18,.85,.3,1.25) forwards}.elimAvatar{width:150px;height:150px;margin:auto;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#222;font-size:62px;border:5px solid #ff653d;box-shadow:0 0 36px rgba(255,63,28,.72)}.elimTitle{margin-top:14px;color:#ffb29d;font-size:20px}.elimName{font-size:34px;font-weight:900;margin-top:4px}.elimReason{color:#c8c8c8;margin-top:5px}@keyframes elimFade{0%,82%{opacity:1}100%{opacity:0}}@keyframes elimPop{to{transform:scale(1)}}
.winbox{min-width:min(92vw,560px);padding:42px}.winAvatar{width:190px;height:190px}.winName{font-size:44px}.winbox h2{font-size:48px}.winner .winbox:after{content:"بطل القنبلة الموقوتة";display:block;color:#f8d989;font-size:18px;margin-top:10px}
@media(max-width:1100px){.arena{min-height:610px}.player{width:150px}.player .avatarFrame{width:82px;height:82px}.player .name{font-size:14px;max-width:105px}}

.player{width:154px;padding:6px 7px 7px;border-radius:18px}

</head><body><div class="wrap"><h1>💣 القنبلة الموقوتة</h1><div class="sub">مرّر القنبلة قبل انتهاء العدّ التنازلي — لا تتردد!</div><div id="tik" class="tik">جاري الاتصال...</div><div id="status" class="status">بانتظار اللاعبين — اكتب «انضم»</div>
<div class="join"><input id="tn" placeholder="اسم لاعب للتجربة"><button onclick="testJoin()">انضم تجريبي</button><div class="fuseChoices" id="fuseChoices"><span class="fuseLabel">⏱ مؤقت القنبلة</span><button type="button" data-sec="10" onclick="setFuse(10)">10 ث</button><button type="button" data-sec="15" onclick="setFuse(15)">15 ث</button><button type="button" data-sec="20" onclick="setFuse(20)">20 ث</button><button type="button" data-sec="25" onclick="setFuse(25)">25 ث</button></div><button id="autoDemoBtn" class="autoDemoBtn" type="button" onclick="autoDemo()">🤖 تجربة تلقائية</button></div><div class="timer" id="timer"></div><div class="arena" id="arena"><div id="bomb" class="bomb"><div class="bombShell"><div class="bolts"></div><div class="timerPlate"></div><div class="fuse"></div></div></div><div id="bombTimer" class="bombTimer">--</div><div class="floorGrid"></div><div id="ambientSmoke" class="ambientSmoke"></div><div class="centerMark"></div><div class="hazardRing"></div></div>
<div class="controls"><button id="start" onclick="startGame()" disabled>ابدأ اللعبة</button><button class="red" onclick="location.reload()">لعبة جديدة</button></div><div class="log" id="log"></div></div><div id="screenFlash" class="screenFlash"></div>
<div id="elimOverlay" class="elimOverlay"><div class="elimCard"><div id="elimAvatar" class="elimAvatar">👤</div><div class="elimTitle">💥 تم إقصاء اللاعب</div><div id="elimName" class="elimName"></div><div class="elimReason">انفجرت القنبلة لديه</div></div></div><div id="winner" class="winner"><div class="winbox"><h2>🏆 الفائز</h2><div id="winnerName"></div><button onclick="location.reload()">لعبة جديدة</button></div></div>
<script>
const E=id=>document.getElementById(id);let players=[],phase='lobby',holder=-1,explodeAt=0,tickInt=null,autoInt=null,ws,retry,audioCtx=null;let fuseSeconds=Number(localStorage.getItem('bombFuseSeconds'))||15;if(![10,15,20,25].includes(fuseSeconds))fuseSeconds=15;
function ac(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,dur,type='sine',gain=.12,delay=0){try{let c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur)}catch(_){}}
function passSound(){tone(620,.09,'sine',.13);tone(880,.12,'sine',.11,.07);tone(1180,.09,'triangle',.08,.14)}
function explosionSound(){try{let c=ac(),len=Math.floor(c.sampleRate*.75),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);let src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(.75,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.75);src.buffer=buf;src.connect(f);f.connect(g);g.connect(c.destination);src.start();tone(85,.55,'sine',.35)}catch(_){}}
const pos=[[12,20],[31,16],[50,15],[69,16],[88,20],[88,80],[69,84],[50,85],[31,84],[12,80]];
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function log(t){E('log').innerHTML='<div>• '+esc(t)+'</div>'+E('log').innerHTML}
function render(){E('arena').querySelectorAll('.player').forEach(x=>x.remove());players.forEach((p,i)=>{let d=document.createElement('div');d.className='player '+(p.alive?'':'out')+(i===holder&&phase==='playing'?' holder':'');d.style.left=pos[i][0]+'%';d.style.top=pos[i][1]+'%';d.innerHTML=`<div class="avatarFrame"><div class="avatar">${p.avatar?`<img src="${esc(p.avatar)}" onerror="this.parentElement.innerHTML='👤'">`:'👤'}</div></div><div class="playerMeta"><span class="num">${i+1}</span><div class="name" title="${esc(p.name)}">${esc(p.name)}</div></div><div class="stateBadge">${p.alive?'داخل اللعبة':'خارج اللعبة'}</div>${p.alive?`<button class="kick red" onclick="kick(${i})" title="طرد اللاعب">طرد</button>`:''}`;E('arena').appendChild(d)});
if(phase==='lobby'){E('status').textContent=`بانتظار اللاعبين ${players.length}/10 — اكتب «انضم»`;E('start').disabled=players.length<2}moveBomb()}
function join(name,avatar='',uid=''){if(phase!=='lobby'||players.length>=10)return;if(players.some(p=>(uid&&p.uid===String(uid))||(!uid&&p.name===name)))return;players.push({name:name||'متابع',avatar,uid:String(uid||''),alive:true});render();log('انضم '+name)}
function testJoin(){join(E('tn').value.trim()||('لاعب '+(players.length+1)),'','t'+Date.now())}
function alive(){return players.map((p,i)=>p.alive?i:-1).filter(i=>i>=0)}
function startGame(){if(alive().length<2)return;phase='playing';E('start').disabled=true;holder=alive()[Math.floor(Math.random()*alive().length)];newFuse();E('status').textContent='بدأت الجولة! حامل القنبلة يكتب رقم لاعب حي لتمريرها.';log('القنبلة بدأت مع '+players[holder].name);moveBomb();runFuse()}
function setFuse(sec){sec=Number(sec);if(![10,15,20,25].includes(sec))return;fuseSeconds=sec;try{localStorage.setItem('bombFuseSeconds',String(sec))}catch(_){};document.querySelectorAll('#fuseChoices button[data-sec]').forEach(b=>b.classList.toggle('active',Number(b.dataset.sec)===sec));if(phase==='lobby'){E('bombTimer').textContent=sec;E('status').textContent='تم اختيار مؤقت القنبلة: '+sec+' ثانية — بانتظار اللاعبين'}log('مؤقت القنبلة: '+sec+' ثانية')}
function newFuse(){explodeAt=Date.now()+(fuseSeconds*1000);updateTimer()}
function updateTimer(){let left=Math.max(0,explodeAt-Date.now()),sec=Math.ceil(left/1000);E('timer').textContent='⏱️ '+sec+' ثانية';E('bombTimer').textContent=sec;E('bomb').classList.toggle('danger',sec<=7);E('bombTimer').classList.toggle('danger',sec<=7);if(sec<=5&&left%1000<110)tone(95,.08,'sine',.05);return left}
function runFuse(){clearInterval(tickInt);tickInt=setInterval(()=>{E('bomb').classList.toggle('tick');let left=updateTimer();if(Math.random()<.08&&holder>=0)smokeBurst(pos[holder][0],pos[holder][1]-3,1);if(left<=0)explode()},100)}
function moveBomb(){let b=E('bomb'),t=E('bombTimer');if(holder>=0&&players[holder]){b.style.left=t.style.left=pos[holder][0]+'%';b.style.top=t.style.top=pos[holder][1]+'%'}else{b.style.left=t.style.left='50%';b.style.top=t.style.top='50%'}}
function pass(fromUid,fromName,target){if(phase!=='playing'||target<0||!players[target]?.alive||target===holder)return;let h=players[holder];let isHolder=(fromUid&&h.uid===String(fromUid))||(!fromUid&&h.name===fromName);if(!isHolder)return;let old=holder;holder=target;passSound();passTrail(old,target);smokeBurst(pos[old][0],pos[old][1],2);log(h.name+' مرّر القنبلة إلى '+players[target].name);moveBomb()}

function smokeBurst(x,y,count=5){let host=E('ambientSmoke')||E('arena');for(let i=0;i<count;i++){let s=document.createElement('span');s.className='smokePuff';s.style.left=x+'%';s.style.top=y+'%';s.style.setProperty('--dur',(1.8+Math.random()*1.8)+'s');s.style.setProperty('--drift',(-70+Math.random()*140)+'px');host.appendChild(s);setTimeout(()=>s.remove(),3800)}}
function passTrail(from,to){if(from<0||to<0||!pos[from]||!pos[to])return;let a=E('arena'),x1=pos[from][0],y1=pos[from][1],x2=pos[to][0],y2=pos[to][1],rect=a.getBoundingClientRect(),dx=(x2-x1)*rect.width/100,dy=(y2-y1)*rect.height/100,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI,t=document.createElement('i');t.className='passTrail';t.style.left=x1+'%';t.style.top=y1+'%';t.style.width=len+'px';t.style.transform='rotate('+ang+'deg)';a.appendChild(t);setTimeout(()=>t.remove(),650)}
function cinematicExplosion(){let a=E('arena'),x=pos[holder][0],y=pos[holder][1],core=document.createElement('i');core.className='explosionCore';core.style.left=x+'%';core.style.top=y+'%';a.appendChild(core);for(let i=0;i<26;i++){let d=document.createElement('i'),ang=Math.random()*Math.PI*2,dist=130+Math.random()*280;d.className='debris';d.style.left=x+'%';d.style.top=y+'%';d.style.setProperty('--dx',Math.cos(ang)*dist+'px');d.style.setProperty('--dy',Math.sin(ang)*dist+'px');d.style.setProperty('--rot',(-420+Math.random()*840)+'deg');a.appendChild(d);setTimeout(()=>d.remove(),1200)}smokeBurst(x,y,12);setTimeout(()=>core.remove(),900)}

function blastParticles(){let a=E('arena');for(let i=0;i<34;i++){let p=document.createElement('i');p.className='particle';let ang=Math.random()*Math.PI*2,dist=90+Math.random()*250;p.style.setProperty('--x',Math.cos(ang)*dist+'px');p.style.setProperty('--y',Math.sin(ang)*dist+'px');p.style.left=pos[holder][0]+'%';p.style.top=pos[holder][1]+'%';p.style.width=p.style.height=(4+Math.random()*9)+'px';a.appendChild(p);setTimeout(()=>p.remove(),900)}}
function impactFx(){E('screenFlash').classList.remove('go');void E('screenFlash').offsetWidth;E('screenFlash').classList.add('go');document.body.classList.add('shake');blastParticles();setTimeout(()=>document.body.classList.remove('shake'),520)}
function showEliminated(p){let o=E('elimOverlay'),a=E('elimAvatar');a.innerHTML=p.avatar?'<img src="'+esc(p.avatar)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">':'👤';E('elimName').textContent=p.name;o.classList.remove('show');void o.offsetWidth;o.classList.add('show');setTimeout(()=>o.classList.remove('show'),1600)}
function explode(){clearInterval(tickInt);if(phase!=='playing')return;phase='boom';explosionSound();impactFx();cinematicExplosion();E('bombTimer').textContent='';let b=E('bomb');b.classList.remove('danger');b.classList.add('boom');let eliminated=players[holder];players[holder].alive=false;showEliminated(eliminated);log('انفجرت القنبلة عند '+players[holder].name);E('status').textContent='💥 خرج '+players[holder].name;render();setTimeout(()=>{b.classList.remove('boom');b.style.opacity='1';let a=alive();if(a.length===1){phase='ended';holder=a[0];moveBomb();let w=players[a[0]];E('winnerName').innerHTML=(w.avatar?'<img class="winAvatar" src="'+esc(w.avatar)+'">':'<div class="winAvatar">👤</div>')+'<div class="winName">'+esc(w.name)+'</div>';tone(523,.18,'sine',.12);tone(659,.18,'sine',.12,.18);tone(784,.35,'sine',.14,.36);E('winner').classList.add('show');E('status').textContent='🏆 '+players[a[0]].name+' هو الفائز';return}phase='playing';holder=a[Math.floor(Math.random()*a.length)];newFuse();moveBomb();E('status').textContent='جولة جديدة — مرّر القنبلة بكتابة رقم لاعب';log('بدأت جولة جديدة مع '+players[holder].name);runFuse()},1800)}
function kick(i){if(!players[i]?.alive)return;players[i].alive=false;if(i===holder&&phase==='playing'){let a=alive();if(a.length){holder=a[0];moveBomb()}}render();log('تم طرد '+players[i].name)}
function comment(name,avatar,text,uid=''){let t=String(text||'').trim();if(t==='انضم'){join(name,avatar,uid);return}let m=t.match(/^(?:مرر\s*)?(10|[1-9])$/);if(m)pass(uid,name,+m[1]-1)}
function autoDemo(){if(phase==='lobby'){while(players.length<10)join('تجريبي '+(players.length+1),'','demo'+players.length);startGame()}clearInterval(autoInt);autoInt=setInterval(()=>{if(phase!=='playing'){if(phase==='ended')clearInterval(autoInt);return}let a=alive().filter(i=>i!==holder);if(a.length)pass(players[holder].uid,players[holder].name,a[Math.floor(Math.random()*a.length)])},900)}
function user(d={}){let u=d.user||d;return{name:u.nickname||u.uniqueId||d.nickname||d.uniqueId||'متابع',uid:String(u.userId||u.id||u.uniqueId||d.userId||d.uniqueId||''),avatar:u.profilePictureUrl||u.avatarThumb||u.profilePicture||d.profilePictureUrl||''}}
function connect(){clearTimeout(retry);try{ws=new WebSocket('hamada://center-live');ws.onopen=()=>{E('tik').classList.add('ok');E('tik').textContent='✓ متصل'};ws.onmessage=e=>{try{let m=JSON.parse(e.data);if(m.event!=='chat')return;let d=m.data||{},u=user(d);comment(u.name,u.avatar,d.comment||d.commentText||d.text||'',u.uid)}catch(_){}};ws.onclose=()=>{E('tik').classList.remove('ok');E('tik').textContent='غير متصل';retry=setTimeout(connect,2500)}}catch(_){retry=setTimeout(connect,2500)}}connect();render();setFuse(fuseSeconds);window.handleTikTokComment=comment;
</script></body></html>
