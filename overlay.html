<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hamada Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Tahoma,Arial,sans-serif;color:#fff}.topline{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;gap:46px;align-items:center}.person{display:flex;gap:12px;align-items:center;filter:drop-shadow(0 6px 16px #0008)}.aw{position:relative;width:86px;height:86px}.av{width:86px;height:86px;border-radius:50%;object-fit:cover;border:3px solid white;position:relative;z-index:2}.orb{position:absolute;inset:-8px;border-radius:50%;border:2px solid #ff3189;border-left-color:transparent;animation:spin 2.5s linear infinite;filter:drop-shadow(0 0 9px #ff3189)}.orb.b{inset:-15px;border-color:#8b5cff transparent #8b5cff #8b5cff;animation-duration:4s;animation-direction:reverse}.name{font-weight:900;font-size:23px;text-shadow:0 2px 10px #000}.sub{font-size:14px;color:#e2e2ea;margin-top:5px;text-shadow:0 2px 8px #000}@keyframes spin{to{transform:rotate(360deg)}}
.ranking{position:absolute;right:26px;top:145px;display:grid;gap:9px;min-width:290px}.ri{display:grid;grid-template-columns:42px 58px 1fr auto;gap:9px;align-items:center;animation:in .35s ease}.rp{width:54px;height:54px;border-radius:50%;border:2px solid #fff;object-fit:cover}.rn{display:inline-block;padding:7px 12px;border:2px solid #ffffff90;border-radius:12px;font-weight:900;text-shadow:0 2px 8px #000;background:transparent}.ri.first .rn{border-color:#ffd55c;box-shadow:0 0 18px #ffd55c77}.num{font-weight:900;font-size:20px;text-shadow:0 2px 8px #000}.likes{font-weight:900;color:#ffd55c;text-shadow:0 2px 8px #000}
.alert{position:absolute;top:160px;left:50%;transform:translate(-50%,-30px) scale(.7);opacity:0;text-align:center;transition:.35s;pointer-events:none}.alert.show{transform:translate(-50%,0) scale(1);opacity:1}.alert .aw{width:120px;height:120px;margin:auto}.alert .av{width:120px;height:120px}.alertName{font-size:28px;font-weight:900;margin-top:16px;text-shadow:0 3px 14px #000}.alertText{font-size:18px;margin-top:7px;text-shadow:0 3px 14px #000}.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff;animation:spark 1.4s infinite ease-in-out}.s1{left:-18px;top:15px}.s2{right:-22px;top:40px;animation-delay:.3s}.s3{left:14px;bottom:-20px;animation-delay:.6s}@keyframes spark{50%{transform:scale(2);opacity:.3}}@keyframes in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.unlock{position:absolute;bottom:20px;left:20px;background:#0008;border:1px solid #ffffff33;padding:9px 12px;border-radius:10px;font-size:12px;display:none}
</style></head><body>
<div class="topline"><div class="person"><div class="aw"><div class="orb"></div><div class="orb b"></div><img id="fpic" class="av"></div><div><div id="fname" class="name">آخر متابع</div><div class="sub">متابعة جديدة</div></div></div><div class="person"><div class="aw"><div class="orb"></div><div class="orb b"></div><img id="lpic" class="av"></div><div><div id="lname" class="name">آخر مكبس</div><div id="lcount" class="sub">0 تكبيس</div></div></div></div>
<div id="ranking" class="ranking"></div>
<div id="alert" class="alert"><div class="aw"><div class="orb"></div><div class="orb b"></div><span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><img id="apic" class="av"></div><div id="aname" class="alertName"></div><div id="atext" class="alertText"></div></div>
<button id="unlock" class="unlock">اضغط لتفعيل الصوت</button><audio id="audio"></audio>
<script>
const $=id=>document.getElementById(id);const def='https://placehold.co/150x150/252938/FFFFFF?text=H';let queue=[],playing=false,music=[],volume=10,current=-1;const synth=window.speechSynthesis;
function av(u){return u?.avatar||def}function setUser(pic,name,u){$(pic).src=av(u);$(name).textContent=u?.nickname||u?.username||'TikTok User'}function rank(list=[]){$('ranking').innerHTML=list.map((u,i)=>`<div class="ri ${i===0?'first':''}"><div class="num">${i===0?'👑':'#'+(i+1)}</div><img class="rp" src="${av(u)}"><div><span class="rn">${u.nickname||u.username}</span></div><div class="likes">${u.likes||0}</div></div>`).join('')}
function alertUser(u,text){setUser('apic','aname',u);$('atext').textContent=text;$('alert').classList.add('show');clearTimeout(window.__a);window.__a=setTimeout(()=>$('alert').classList.remove('show'),4500)}
async function loadMusic(){try{music=(await (await fetch('/api/music')).json()).items||[]}catch{}}
function findSong(q){q=(q||'').toLowerCase().trim();if(!q)return music[current>=0?current:0];return music.find(s=>s.title.toLowerCase().includes(q)||s.filename.toLowerCase().includes(q))}
async function musicCmd(m){if(m.command==='volume'){volume=m.value;$('audio').volume=volume/100;return}if(m.command==='stop'){$('audio').pause();$('audio').currentTime=0;playing=false;return}if(m.command==='pause'){$('audio').pause();playing=false;return}if(m.command==='skip'){if(!music.length)return;current=(current+1)%music.length;$('audio').src=music[current].url;try{await $('audio').play();playing=true}catch{$('unlock').style.display='block'}return}if(m.command==='play'){if(!m.query&&$('audio').src){try{await $('audio').play();playing=true}catch{$('unlock').style.display='block'}return}let s=findSong(m.query);if(!s)return;current=music.indexOf(s);$('audio').src=s.url;$('audio').volume=volume/100;try{await $('audio').play();playing=true}catch{$('unlock').style.display='block'}}}
function speak(t){if(!t)return;let u=new SpeechSynthesisUtterance(t);u.lang='ar-IQ';u.rate=1;try{synth.speak(u)}catch{}}
const proto=location.protocol==='https:'?'wss:':'ws:';const ws=new WebSocket(proto+'//'+location.host+'/ws');setInterval(()=>{try{if(ws.readyState===1)ws.send('ping')}catch{}},30000);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'){let s=m.state||{};if(s.lastFollower)setUser('fpic','fname',s.lastFollower);if(s.lastLiker){setUser('lpic','lname',s.lastLiker);$('lcount').textContent=(s.lastLiker.likes||0)+' تكبيس'}rank(s.ranking||[]);volume=s.music?.volume??volume;$('audio').volume=volume/100}if(m.type==='follow')setUser('fpic','fname',m.user);if(m.type==='like'){setUser('lpic','lname',m.user);$('lcount').textContent=(m.likes||0)+' تكبيس'}if(m.type==='member'&&m.alert)alertUser(m.user,'انضم إلى البث');if(m.type==='action-alert')alertUser(m.user,'وصل إلى '+m.value+' تكبيس');if(m.type==='tts')speak(m.user.nickname+' يقول '+m.text);if(m.type==='music-command')musicCmd(m)};$('unlock').onclick=()=>{$('unlock').style.display='none';musicCmd({command:'play',query:''})};$('audio').onended=()=>musicCmd({command:'skip'});loadMusic();
</script></body></html>
